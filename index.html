<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamVault — Your Ultimate Archive of Exam Papers</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- SSR Data Injection (Safely handled for Static/Vercel Deployment) -->
  <script>
    window.SERVER_CONFIG = window.SERVER_CONFIG || null;
  </script>
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="logo" onclick="setMode('school')">
        <div class="logo-mark">V</div>
        <div class="logo-name">Exam<em>Vault</em></div>
      </div>
      
      <div class="nav-search-wrap">
        <input type="text" class="nav-search" placeholder="Search for subjects, boards, or years..." oninput="handleNavSearch(this.value)" onkeyup="if(event.key==='Enter')applyNavSearch()">
        <span class="nav-search-icon">🔍</span>
      </div>

      <div class="nav-pills" id="authContainer">
        <!-- Auth buttons injected here -->
        <button class="nav-pill" id="loginBtn" onclick="openLoginModal()" style="color:var(--gold);border:1px solid rgba(240,180,41,0.3)">Login</button>
      </div>

      <button class="nav-upload" id="uploadBtn" style="display:none" onclick="openUploadModal()">Upload Paper</button>
    </div>
  </nav>

  <!-- BREADCRUMBS -->
  <div class="breadcrumb" id="breadcrumb" style="display:none"></div>

  <!-- MAIN RENDER AREA -->
  <div id="renderArea">
    <!-- Content dynamically injected by ui.js -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh">
      <div class="loading-spinner"></div>
      <p style="color:var(--muted);font-weight:600">Loading ExamVault...</p>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div class="modal-overlay" id="loginModalOverlay" onclick="if(event.target===this)closeLoginModal()">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <div class="modal-title" id="authModalTitle">Admin / Contributor Login</div>
        <button class="modal-close" onclick="closeLoginModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="authForm" onsubmit="handleAuth(event)" style="display:flex;flex-direction:column;gap:15px">
          <input type="hidden" id="authMode" value="login">
          <div>
            <label style="font-size:12px;font-weight:700;display:block;margin-bottom:5px">Email Address</label>
            <input type="email" name="email" id="authEmail" required style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-md)" placeholder="you@example.com">
          </div>
          <div>
            <label style="font-size:12px;font-weight:700;display:block;margin-bottom:5px">Password</label>
            <input type="password" name="password" id="authPassword" required style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-md)" placeholder="••••••••">
          </div>
          <button type="submit" class="btn-lg btn-dl-lg" id="authSubmitBtn" style="width:100%;justify-content:center">Sign In</button>
          <p style="text-align:center;font-size:12px;color:var(--muted)">
            <span id="authToggleText">Don't have an account?</span> 
            <a href="#" onclick="toggleAuthMode(); return false;" id="authToggleLink" style="color:var(--teal);font-weight:700;text-decoration:none">Sign Up</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- UPLOAD MODAL -->
  <div class="modal-overlay" id="uploadModalOverlay" onclick="if(event.target===this)closeUploadModal()">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <div class="modal-title">Upload Exam Paper</div>
        <button class="modal-close" onclick="closeUploadModal()">✕</button>
      </div>
      <div class="modal-body">

        <!-- Auto-parse hint -->
        <div id="uploadParseBadge" style="display:none;background:var(--teal-pale);border:1px solid var(--teal);border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--teal)">
          ✨ <strong>Auto-filled</strong> from filename — please verify and correct if needed.
        </div>

        <form id="uploadForm" onsubmit="handleUpload(event)" style="display:flex;flex-direction:column;gap:13px">

          <!-- FILE FIRST so parse fires before user edits -->
          <div>
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">PDF File</label>
            <input type="file" id="uploadFileInput" name="file" accept="application/pdf" required
              onchange="autoFillFromFilename(this)"
              style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--page)">
          </div>

          <!-- Subject + Year -->
          <div style="display:grid;grid-template-columns:1fr 120px;gap:12px">
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Subject Name</label>
              <input type="text" id="upSubject" name="subject" required placeholder="e.g. Artificial Intelligence"
                style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Year</label>
              <input type="number" id="upYear" name="year" required value="2025" min="2000" max="2099"
                style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
          </div>

          <!-- Board + Course -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Board / University</label>
              <input type="text" id="upBoard" name="board" required placeholder="e.g. CBSE, AKTU, DU"
                style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Class / Course</label>
              <input type="text" id="upCls" name="cls" required placeholder="e.g. 12, B.Tech, BCA"
                style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
          </div>

          <!-- Stream + Paper Type -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Stream / Branch / Semester</label>
              <input type="text" id="upStream" name="stream" placeholder="e.g. Science, 1st Semester, CSE"
                style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Paper Type</label>
              <select id="upPaperType" name="paper_type"
                style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--page)">
                <option value="Board Exam">Board Exam</option>
                <option value="End Sem">End Sem</option>
                <option value="Mid Sem">Mid Sem</option>
                <option value="Sample Paper">Sample Paper</option>
                <option value="Practice Paper">Practice Paper</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-lg btn-dl-lg" style="width:100%;justify-content:center;margin-top:6px">
            Upload Paper
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span class="toast-icon">✨</span>
    <span id="toastMsg">Action successful</span>
  </div>

  <!-- App Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    function openUploadModal() { document.getElementById('uploadModalOverlay').classList.add('open'); }
    function closeUploadModal() { document.getElementById('uploadModalOverlay').classList.remove('open'); }

    /**
     * Parses a standardised exam-paper filename and returns extracted fields.
     * Handles patterns like:
     *   btech-1-sem-subject-name-code-mar-2025.pdf
     *   cbse-class-10-mathematics-2024.pdf
     *   aktu-mca-2-sem-data-structures-2023.pdf
     */
    function parseExamFilename(filename) {
      const name = filename.replace(/\.pdf$/i, '').toLowerCase();
      const parts = name.split('-');
      const result = { subject: '', year: '', cls: '', stream: '', board: '', paper_type: '' };

      // Maps
      const courseMap = {
        'btech':'B.Tech','mtech':'M.Tech','bca':'BCA','mca':'MCA','mba':'MBA',
        'bsc':'B.Sc','msc':'M.Sc','ba':'BA','ma':'MA','bcom':'B.Com','mcom':'M.Com',
        'diploma':'Diploma','phd':'Ph.D','bpharm':'B.Pharm','mpharm':'M.Pharm'
      };
      const boardMap = {
        'cbse':'CBSE','icse':'ICSE','aktu':'AKTU','du':'DU','mu':'MU',
        'up':'UP Board','rb':'Rajasthan Board','mp':'MP Board','jntu':'JNTU',
        'vtu':'VTU','ktu':'KTU','anna':'Anna University'
      };
      const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      const ordinals = ['1st','2nd','3rd','4th','5th','6th','7th','8th'];

      let idx = 0;

      // 1. Board — first token if it's a known board
      if (boardMap[parts[0]]) {
        result.board = boardMap[parts[0]];
        idx = 1;
      }

      // 2. Course — next token if known course
      if (courseMap[parts[idx]]) {
        result.cls = courseMap[parts[idx]];
        idx++;
      } else if (parts[idx] === 'class' && !isNaN(parts[idx + 1])) {
        // "class-10" style
        result.cls = 'Class ' + parts[idx + 1];
        idx += 2;
      }

      // 3. Semester — number followed by "sem"
      if (!isNaN(parts[idx]) && parseInt(parts[idx]) >= 1 && parseInt(parts[idx]) <= 12
          && parts[idx + 1] === 'sem') {
        const n = parseInt(parts[idx]);
        result.stream = (ordinals[n - 1] || n + 'th') + ' Semester';
        result.paper_type = 'End Sem';
        idx += 2;
      }

      // 4. Year — 4-digit number >= 2000, scanning from the end
      let yearIdx = -1;
      for (let i = parts.length - 1; i >= idx; i--) {
        if (/^\d{4}$/.test(parts[i]) && parseInt(parts[i]) >= 2000) {
          result.year = parts[i];
          yearIdx = i;
          break;
        }
      }

      // 5. Month right before year (skip it — not needed in form)
      let endIdx = yearIdx > -1 ? yearIdx : parts.length;
      if (endIdx > 0 && months.includes(parts[endIdx - 1])) endIdx--;

      // 6. Subject code — last token before month/year if matches pattern like "kec101t"
      if (endIdx > idx && /^[a-z]{2,4}\d{3}[a-z]?$/.test(parts[endIdx - 1])) endIdx--;

      // 7. Subject — everything remaining between idx and endIdx
      if (endIdx > idx) {
        result.subject = parts.slice(idx, endIdx)
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ');
      }

      // 8. Default paper type
      if (!result.paper_type) result.paper_type = 'Board Exam';

      return result;
    }

    function autoFillFromFilename(input) {
      if (!input.files || !input.files[0]) return;
      const filename = input.files[0].name;
      const p = parseExamFilename(filename);

      // Fill fields
      if (p.subject)    document.getElementById('upSubject').value   = p.subject;
      if (p.year)       document.getElementById('upYear').value      = p.year;
      if (p.cls)        document.getElementById('upCls').value       = p.cls;
      if (p.board)      document.getElementById('upBoard').value     = p.board;
      if (p.stream)     document.getElementById('upStream').value    = p.stream;
      if (p.paper_type) {
        const sel = document.getElementById('upPaperType');
        for (let i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === p.paper_type) { sel.selectedIndex = i; break; }
        }
      }

      // Show badge if at least one field was filled
      const anyFilled = p.subject || p.year || p.cls || p.board || p.stream;
      document.getElementById('uploadParseBadge').style.display = anyFilled ? 'block' : 'none';
    }

    async function handleUpload(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      toast('Uploading paper...');
      try {
        const res = await fetch(API_BASE + '/api/upload', { method: 'POST', body: formData });
        if (res.ok) {
          toast('Paper uploaded successfully!');
          closeUploadModal();
          e.target.reset();
          document.getElementById('uploadParseBadge').style.display = 'none';
          if (S.step === 4) { await fetchPapers(); render(); }
        } else {
          const err = await res.json().catch(() => ({}));
          toast('Upload failed: ' + (err.detail || res.status));
        }
      } catch (err) { toast('Connection error during upload.'); }
    }
  </script>
</body>
</html>
