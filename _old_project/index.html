<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamVault — Your Ultimate Archive of Exam Papers</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- SSR Data Injection (Safely handled for Static/Vercel Deployment) -->
  <script>
    window.SERVER_CONFIG = window.SERVER_CONFIG || null;
  </script>
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="logo" onclick="setMode('school')">
        <div class="logo-mark">V</div>
        <div class="logo-name">Exam<em>Vault</em></div>
      </div>
      
      <div class="nav-search-wrap">
        <input type="text" class="nav-search" placeholder="Search for subjects, boards, or years..." oninput="handleNavSearch(this.value)" onkeyup="if(event.key==='Enter')applyNavSearch()">
        <span class="nav-search-icon">🔍</span>
      </div>

      <div class="nav-pills" id="authContainer">
        <!-- Auth buttons injected here -->
        <button class="nav-pill" id="loginBtn" onclick="openLoginModal()" style="color:var(--gold);border:1px solid rgba(240,180,41,0.3)">Login</button>
      </div>

      <button class="nav-upload" id="uploadBtn" style="display:none" onclick="openUploadModal()">Upload Paper</button>
    </div>
  </nav>

  <!-- BREADCRUMBS -->
  <div class="breadcrumb" id="breadcrumb" style="display:none"></div>

  <!-- MAIN RENDER AREA -->
  <div id="renderArea">
    <!-- Content dynamically injected by ui.js -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh">
      <div class="loading-spinner"></div>
      <p style="color:var(--muted);font-weight:600">Loading ExamVault...</p>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div class="modal-overlay" id="loginModalOverlay" onclick="if(event.target===this)closeLoginModal()">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <div class="modal-title" id="authModalTitle">Admin / Contributor Login</div>
        <button class="modal-close" onclick="closeLoginModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="authForm" onsubmit="handleAuth(event)" style="display:flex;flex-direction:column;gap:15px">
          <input type="hidden" id="authMode" value="login">
          <div>
            <label style="font-size:12px;font-weight:700;display:block;margin-bottom:5px">Email Address</label>
            <input type="email" name="email" id="authEmail" required style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-md)" placeholder="you@example.com">
          </div>
          <div>
            <label style="font-size:12px;font-weight:700;display:block;margin-bottom:5px">Password</label>
            <input type="password" name="password" id="authPassword" required style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--r-md)" placeholder="••••••••">
          </div>
          <button type="submit" class="btn-lg btn-dl-lg" id="authSubmitBtn" style="width:100%;justify-content:center">Sign In</button>
          <p style="text-align:center;font-size:12px;color:var(--muted)">
            <span id="authToggleText">Don't have an account?</span> 
            <a href="#" onclick="toggleAuthMode(); return false;" id="authToggleLink" style="color:var(--teal);font-weight:700;text-decoration:none">Sign Up</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- UPLOAD MODAL -->
  <div class="modal-overlay" id="uploadModalOverlay" onclick="if(event.target===this)closeUploadModal()">
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <div class="modal-title">Upload New Paper</div>
        <button class="modal-close" onclick="closeUploadModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="uploadForm" onsubmit="handleUpload(event)" style="display:flex;flex-direction:column;gap:15px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Subject</label>
              <input type="text" name="subject" required style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Year</label>
              <input type="number" name="year" required value="2025" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
            </div>
          </div>
          <div>
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Board / University</label>
            <input type="text" name="board" required placeholder="e.g. CBSE, AKTU" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
          </div>
          <div>
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Class / Course</label>
            <input type="text" name="cls" required placeholder="e.g. 12, B.Tech" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm)">
          </div>
          <div>
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">PDF File</label>
            <input type="file" name="file" accept="application/pdf" required style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--page)">
          </div>
          <button type="submit" class="btn-lg btn-dl-lg" style="width:100%;justify-content:center;margin-top:10px">Start Upload</button>
        </form>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span class="toast-icon">✨</span>
    <span id="toastMsg">Action successful</span>
  </div>

  <!-- App Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Extra helper for upload modal which is less frequently used
    function openUploadModal() { document.getElementById('uploadModalOverlay').classList.add('open'); }
    function closeUploadModal() { document.getElementById('uploadModalOverlay').classList.remove('open'); }
    
    async function handleUpload(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      toast("📤 Uploading paper...");
      try {
        const res = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: formData });
        if (res.ok) {
          toast("✅ Paper uploaded successfully!");
          closeUploadModal();
          if (S.step === 4) fetchPapers(); render();
        } else {
          toast("❌ Upload failed.");
        }
      } catch (err) { toast("❌ Connection error."); }
    }
  </script>
</body>
</html>
